name: Auto Sync Fork Universal

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight UTC
  workflow_dispatch: # Allows you to manually trigger it anytime

jobs:
  sync:
    name: Sync Latest Upstream Changes
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Sync upstream changes
        # Automatically detects the current repository and default branch name
        run: gh repo sync $REPOSITORY -b $BRANCH_NAME
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
